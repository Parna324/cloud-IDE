AWSTemplateFormatVersion: "2010-09-09"
Description: Cloud IDE demo host in a default VPC. Limit AllowedCidr to your IP.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Default VPC in ap-southeast-2.
  SourceBucket:
    Type: String
    Description: S3 bucket containing the uploaded project archive.
  SourceKey:
    Type: String
    Default: cloud-ide-deploy.zip
  AllowedCidr:
    Type: String
    Description: Your public IPv4 address in CIDR form, for example 203.0.113.10/32.
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/(3[0-2]|[12]?[0-9])$"
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium, t3.large]

Resources:
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow web access from the specified client IP only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
      Tags:
        - Key: Name
          Value: cloud-ide-web

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: DownloadDeploymentArchive
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${SourceBucket}/${SourceKey}

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref AppRole]

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref AppInstanceProfile
      SecurityGroupIds: [!GetAtt AppSecurityGroup.GroupId]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 40
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker unzip awscli-2
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          mkdir -p /opt/cloudide
          aws s3 cp s3://${SourceBucket}/${SourceKey} /tmp/cloud-ide-deploy.zip
          unzip -q /tmp/cloud-ide-deploy.zip -d /opt/cloudide
          cd /opt/cloudide
          printf 'POSTGRES_USER=cloudide\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=cloudide\nJWT_SECRET=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 48)" > .env
          chmod 600 .env
          docker compose -f docker-compose.aws.yml --profile runner-build build
          docker compose -f docker-compose.aws.yml up -d --build
      Tags:
        - Key: Name
          Value: cloud-ide

Outputs:
  AppUrl:
    Description: Open this URL after the instance finishes initializing.
    Value: !Sub http://${AppInstance.PublicDnsName}
  InstanceId:
    Value: !Ref AppInstance
  SecurityGroupId:
    Value: !Ref AppSecurityGroup
