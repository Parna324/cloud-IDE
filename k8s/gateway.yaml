apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: cloud-ide-gateway:latest
          ports:
            - containerPort: 5000
          env:
            - name: AUTH_SERVICE_URL
              value: http://auth-service:5001
            - name: EXECUTION_ENGINE_URL
              value: http://execution-engine:5002
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 5000
      targetPort: 5000
