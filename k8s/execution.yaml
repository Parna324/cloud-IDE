apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: execution-engine
  template:
    metadata:
      labels:
        app: execution-engine
    spec:
      containers:
        - name: execution-engine
          image: cloud-ide-execution:latest
          ports:
            - containerPort: 5002
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
---
apiVersion: v1
kind: Service
metadata:
  name: execution-engine
spec:
  selector:
    app: execution-engine
  ports:
    - port: 5002
      targetPort: 5002
